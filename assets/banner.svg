<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sendy Tegar Mahendra</title>
  <desc id="d">IoT and Systems Engineer | Smart Automation Specialist</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c9cdb"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <!-- Circuit decoration (right side) -->
  <g fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M690 50H735L780 95H820"/>
    <path d="M700 130H820"/>
    <path d="M700 215H745L795 165H820"/>
    <path d="M900 95H945L970 70"/>
    <path d="M900 130H975"/>
    <path d="M900 165H945L970 190"/>
    <rect x="820" y="80" width="80" height="100" rx="10" stroke-opacity="0.6" fill="#0f2027" fill-opacity="0.55"/>
  </g>

  <g fill="#5eead4">
    <circle cx="690" cy="50" r="4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="130" r="4">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="215" r="4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="70" r="4" fill-opacity="0.7"/>
    <circle cx="975" cy="130" r="4" fill-opacity="0.7"/>
    <circle cx="970" cy="190" r="4" fill-opacity="0.7"/>
  </g>
  <text x="860" y="136" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" font-weight="700" fill="#5eead4">IoT</text>

  <!-- Main text -->
  <text x="60" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" fill="#ffffff">Sendy Tegar Mahendra</text>
  <rect x="60" y="145" width="90" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#cfe9f5">IoT &amp; Systems Engineer  |  Smart Automation Specialist</text>

  <!-- Bottom accent line -->
  <rect y="256" width="1000" height="4" fill="url(#accent)"/>
</svg>
